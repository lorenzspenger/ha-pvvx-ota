# pvvx_pin_pairing: ESPHome package for the Home Assistant integration ha-pvvx-ota
# https://github.com/lorenzspenger/ha-pvvx-ota
#
# Use it on an ESPHome Bluetooth proxy that should pair PIN-protected pvvx sensors. In the proxy's YAML:
#
#   packages:
#     pvvx_pin_pairing: github://lorenzspenger/ha-pvvx-ota/esphome/pvvx_pin_pairing.yaml@main
#   # (pin a tag instead of main once releases exist, for example @v0.24.0-beta.2)
#
#   esp32_ble:
#     max_connections: <proxy slots + other ble_clients + 1>
# (the package sets io_capability and auth_req_mode itself; they affect every pairing this ESP32 does: peripherals
# without input/output still pair Just Works).
esp32_ble:
  io_capability: keyboard_only
  auth_req_mode: sc_mitm_bond

globals:
  - id: pvvx_clear_sent
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: pvvx_pair_asked
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: pvvx_pair_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: pvvx_pin
    type: uint32_t
    restore_value: no
    initial_value: '0'

binary_sensor:
  - platform: template
    id: pvvx_pairer_busy
    name: "pvvx pairer busy"
    icon: mdi:bluetooth-connect
    entity_category: diagnostic
    # ON while pair_pvvx holds the pairer (connecting, pairing, disconnecting). Home Assistant waits for OFF before it connects to
    # the sensor itself: a sensor takes one connection, and the pairer's disconnect would tear down a link Home Assistant reused.
    # Its state is unknown until the first pairing; unknown counts as idle.

text_sensor:
  - platform: template
    id: pvvx_pair_result
    name: "pvvx pair result"
    icon: mdi:bluetooth-settings
    entity_category: diagnostic
    # pvvx_clear_pin ends with "pin clear sent" (the command was written on a link that was still open; the sensor reboots without a PIN
    # when the link closes, which Home Assistant checks), "clear not sent" (the link dropped before the write) or the results below.
    # "timeout" means the run hung and the watchdog stopped it (the sensor was most likely not reachable).
    # "pairing" while it runs, then "passkey answered" (the sensor asked for the PIN and got it), "no passkey asked" (the pairer
    # reached the sensor but it never asked: it paired without a PIN prompt, Just Works, and the key it gives is refused) or
    # "no connection" (the sensor was not connectable; Home Assistant retries that).

ble_client:
  - mac_address: "00:00:00:00:00:01"   # placeholder; pair_pvvx sets the real address at run time
    id: pvvx_pairer
    auto_connect: false
    on_connect:
      then:
        - lambda: 'id(pvvx_pair_connected) = true;'
        - logger.log:
            level: INFO
            format: "pvvx pairer: connected to %s"
            args: ['id(pvvx_pairer)->address_str()']
    on_disconnect:
      then:
        - logger.log:
            level: INFO
            format: "pvvx pairer: disconnected from %s"
            args: ['id(pvvx_pairer)->address_str()']
    on_passkey_request:
      then:
        - lambda: 'id(pvvx_pair_asked) = true;'
        - logger.log:
            level: INFO
            format: "pvvx pairer: passkey requested, answering with the PIN from Home Assistant"
        - ble_client.passkey_reply:
            id: pvvx_pairer
            passkey: !lambda 'return id(pvvx_pin);'

script:
  # Watchdog: a run that hangs (a failed connect can leave pvvx_pairer_run stuck, and the busy flag then blocks every later call) is
  # stopped after 90 s: the link is dropped, the PIN zeroed, the result set to "timeout" and the busy flag cleared. A normal run
  # takes at most about 65 s and cancels it.
  - id: pvvx_watchdog
    mode: restart
    then:
      - delay: 90s
      - script.stop: pvvx_pairer_run
      - ble_client.disconnect: pvvx_pairer
      - lambda: 'id(pvvx_pin) = 0;'
      - text_sensor.template.publish:
          id: pvvx_pair_result
          state: "timeout"
      - binary_sensor.template.publish:
          id: pvvx_pairer_busy
          state: OFF
  - id: pvvx_pairer_run
    mode: single
    parameters:
      mac: string
      pin: int
      clear: bool
    then:
      - if:
          condition:
            lambda: |-
              if (id(pvvx_pairer_busy)->state) return false;  // one pairing at a time: the single pairer has one address and PIN
              if (pin < 1 || pin > 999999) return false;
              unsigned b[6];
              if (sscanf(mac.c_str(), "%x:%x:%x:%x:%x:%x", &b[0], &b[1], &b[2], &b[3], &b[4], &b[5]) != 6) return false;
              uint64_t addr = 0;
              for (int i = 0; i < 6; i++) addr = (addr << 8) | (b[i] & 0xFF);
              id(pvvx_pin) = (uint32_t) pin;
              id(pvvx_pairer)->set_address(addr);
              // forget any old bond first (a stale or Just Works one makes the sensor refuse with "insufficient authentication"
              // and pairing then reuses it without asking for the passkey): every call makes a fresh PIN pairing
              esp_bd_addr_t bda;
              for (int i = 0; i < 6; i++) bda[i] = (addr >> (8 * (5 - i))) & 0xFF;
              esp_ble_remove_bond_device(bda);
              id(pvvx_pair_connected) = false;
              id(pvvx_pair_asked) = false;
              id(pvvx_clear_sent) = false;
              return true;
          then:
            - text_sensor.template.publish:
                id: pvvx_pair_result
                state: "pairing"
            - binary_sensor.template.publish:
                id: pvvx_pairer_busy
                state: ON
            - script.execute: pvvx_watchdog
            - ble_client.connect: pvvx_pairer
            # the hold counts from the link being open (opening can take 5 s or more), then pairing takes about 15 s
            - wait_until:
                condition:
                  lambda: 'return id(pvvx_pairer)->connected();'
                timeout: 30s
            - if:
                condition:
                  lambda: 'return clear;'
                then:
                  # wait for the passkey exchange, then give the authentication a few seconds to finish: there is no "auth complete"
                  # trigger. Without a passkey request the link is not authenticated and the write would only be refused.
                  - wait_until:
                      condition:
                        lambda: 'return id(pvvx_pair_asked);'
                      timeout: 20s
                  - delay: 10s
                  - if:
                      condition:
                        lambda: 'return id(pvvx_pair_asked);'
                      then:
                        - logger.log:
                            level: INFO
                            format: "pvvx pairer: writing the PIN clear command (a refused write is logged by esp32_ble_client)"
                        - ble_client.ble_write:
                            id: pvvx_pairer
                            service_uuid: "00001f10-0000-1000-8000-00805f9b34fb"
                            characteristic_uuid: "00001f1f-0000-1000-8000-00805f9b34fb"
                            value: [0x70, 0x00, 0x00, 0x00, 0x00]
                        - delay: 3s
                        # a write on a link that already dropped is not sent (esphome logs "not connected"), so only a still-open link counts
                        - lambda: 'id(pvvx_clear_sent) = id(pvvx_pairer)->connected();'
                else:
                  - delay: 20s
            - ble_client.disconnect: pvvx_pairer
            - delay: 2s
            - lambda: 'id(pvvx_pin) = 0;'
            - text_sensor.template.publish:
                id: pvvx_pair_result
                state: !lambda |-
                  if (!id(pvvx_pair_connected)) return "no connection";
                  if (!id(pvvx_pair_asked)) return "no passkey asked";
                  if (clear) return id(pvvx_clear_sent) ? "pin clear sent" : "clear not sent";
                  return "passkey answered";
            - script.stop: pvvx_watchdog
            - binary_sensor.template.publish:
                id: pvvx_pairer_busy
                state: OFF
          else:
            - logger.log:
                level: WARN
                format: "pvvx pairer: busy, or bad MAC or PIN (PIN must be 1..999999)"

api:
  actions:
    # forget_pvvx(mac): remove the bond with that sensor from this ESP32's flash (Home Assistant calls it when the sensor's entry is
    # removed). Does nothing while a pairing runs.
    - action: forget_pvvx
      variables:
        mac: string
      then:
        - lambda: |-
            if (id(pvvx_pairer_busy)->state) return;
            unsigned b[6];
            if (sscanf(mac.c_str(), "%x:%x:%x:%x:%x:%x", &b[0], &b[1], &b[2], &b[3], &b[4], &b[5]) != 6) return;
            esp_bd_addr_t bda;
            for (int i = 0; i < 6; i++) bda[i] = b[i] & 0xFF;
            esp_ble_remove_bond_device(bda);
            ESP_LOGI("pvvx", "forgot the bond with %s", mac.c_str());
    - action: pair_pvvx
      variables:
        mac: string
        pin: int
      then:
        - script.execute:
            id: pvvx_pairer_run
            mac: !lambda 'return mac;'
            pin: !lambda 'return pin;'
            clear: false
    - action: pvvx_clear_pin
      variables:
        mac: string
        pin: int
      then:
        - script.execute:
            id: pvvx_pairer_run
            mac: !lambda 'return mac;'
            pin: !lambda 'return pin;'
            clear: true
