name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hassfest and the HACS action are meant to follow their moving refs (their documentation says @master / @main): new validation rules should
      # show up here before users hit them, so they are deliberately not pinned
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # the HACS action can only validate public repositories ("... is private, the HACS action can only validate public repositories")
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # no PR in home-assistant/brands (the icon ships in custom_components/pvvx_ota/brand/)
          ignore: brands
