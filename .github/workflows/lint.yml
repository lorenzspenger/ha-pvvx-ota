name: Lint

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.17.6
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.17.6
          args: format --check
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # the same pinned Home Assistant the tests use (requirements_test.txt), plus mypy: the Bluetooth libraries have to be installed for strict typing
      - run: pip install -r requirements_test.txt mypy==2.4.1
      - run: mypy
