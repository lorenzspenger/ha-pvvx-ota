name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest -q --cov=custom_components/pvvx_ota --cov-branch --cov-report=term-missing --cov-report=json --cov-fail-under=95
      - name: Every module at 95 % or more
        run: python scripts/check_module_coverage.py 95
