[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "BLE"]
ignore = ["ASYNC109", "E501"]  # ASYNC109: explicit timeout parameters are intentional; E501: the formatter wraps code, long strings/tables stay

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # fixtures are imported from sibling test modules

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_defaults: keep the shipped entity enabled defaults",
    "unheard: no connectable scanner has heard the sensor",
]

[tool.mypy]
python_version = "3.14"
files = ["custom_components"]
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
# HA's typed schema classes (probatio) lag behind the voluptuous objects that cv/vol still hand out.
module = ["pvvx_ota.update", "pvvx_ota.config_flow", "custom_components.pvvx_ota.update", "custom_components.pvvx_ota.config_flow"]
disable_error_code = ["dict-item", "arg-type"]
